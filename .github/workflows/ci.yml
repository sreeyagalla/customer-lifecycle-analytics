name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: cla fetch --only hillstrom
      # Full-data tests skip here (the 45 MB workbook is not downloaded in CI);
      # everything else runs on the committed real sample.
      - run: pytest -q
